<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Casa · Villagio Brunelli</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 3rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; color: #1a1a1a; margin-bottom: 0.5rem; }
    .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 2rem; }
    .address {
      background: #f5f0eb;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: #555;
    }
    .address strong { color: #1a1a1a; display: block; margin-bottom: 0.2rem; }
    .btn {
      display: block;
      padding: 1.1rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .btn-luiz { background: #2c3e50; color: white; }
    .btn-priscila { background: #c0392b; color: white; }
    .note { font-size: 0.8rem; color: #aaa; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏠</div>
    <h1>Projeto Casa</h1>
    <p class="subtitle">Briefing arquitetônico — responda individualmente</p>
    <div class="address">
      <strong>Lote 12 · Quadra F · Villagio Brunelli</strong>
      Rua 4 · Araçoiaba da Serra / SP · 521,30 m²
    </div>
    <a href="luiz.html" class="btn btn-luiz">Sou o Luiz →</a>
    <a href="priscila.html" class="btn btn-priscila">Sou a Priscila →</a>
    <p class="note">Responda sem consultar o outro — depois comparamos as respostas juntos.</p>
  </div>
</body>
</html>
