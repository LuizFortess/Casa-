<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #2c3e50;
      --accent: #e67e22;
      --bg: #f5f0eb;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #888;
      --border: #e0d8d0;
      --selected-bg: #2c3e50;
      --selected-text: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); min-height: 100vh; padding: 1rem; }

    /* Header */
    .header { max-width: 640px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .back-btn { text-decoration: none; color: var(--muted); font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; }
    .who-tag { background: var(--primary); color: white; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

    /* Progress */
    .progress-wrap { max-width: 640px; margin: 0 auto 1.5rem; }
    .progress-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.4s ease; border-radius: 4px; }
    .progress-label { font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; text-align: right; }

    /* Card */
    .card { background: var(--card); border-radius: 20px; padding: 2rem; max-width: 640px; margin: 0 auto 1rem; box-shadow: 0 2px 20px rgba(0,0,0,0.06); }
    .section-tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; margin-bottom: 0.5rem; }
    .question { font-size: 1.15rem; font-weight: 600; color: var(--text); margin-bottom: 0.3rem; line-height: 1.4; }
    .question-note { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.2rem; }

    /* Options */
    .options { display: flex; flex-direction: column; gap: 0.6rem; }
    .option {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.95rem;
      color: var(--text);
      user-select: none;
    }
    .option:hover { border-color: var(--primary); background: #f8f6f3; }
    .option.selected { border-color: var(--primary); background: var(--primary); color: white; }
    .option .emoji { font-size: 1.2rem; flex-shrink: 0; }
    .option .label { font-weight: 500; }
    .option .desc { font-size: 0.78rem; opacity: 0.7; display: block; margin-top: 0.15rem; }

    /* Options grid (2 cols) */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .options-grid .option { flex-direction: column; align-items: flex-start; text-align: left; }

    /* Multi-select hint */
    .multi-hint { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.3rem; }

    /* Text input */
    .text-input {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.15s;
    }
    .text-input:focus { outline: none; border-color: var(--primary); }

    /* Nav buttons */
    .nav { display: flex; gap: 0.8rem; max-width: 640px; margin: 0 auto; }
    .btn-prev {
      flex: 1;
      padding: 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-prev:hover { border-color: var(--primary); }
    .btn-next {
      flex: 2;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-next:hover { background: #1a252f; }
    .btn-next:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

    /* Welcome screen */
    .welcome { text-align: center; padding: 1rem 0; }
    .welcome .big-icon { font-size: 4rem; margin-bottom: 1rem; }
    .welcome h1 { font-size: 1.6rem; color: var(--text); margin-bottom: 0.5rem; }
    .welcome p { color: var(--muted); font-size: 0.95rem; margin-bottom: 0.4rem; line-height: 1.6; }
    .lot-info { background: var(--bg); border-radius: 12px; padding: 1rem; margin: 1.5rem 0; text-align: left; }
    .lot-info .lot-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; margin-bottom: 0.5rem; }
    .lot-info .lot-detail { font-size: 0.85rem; color: #555; line-height: 1.7; }
    .lot-info strong { color: var(--text); }

    /* Thank you screen */
    .thankyou { text-align: center; padding: 1rem 0; }
    .thankyou .big-icon { font-size: 4rem; margin-bottom: 1rem; }
    .thankyou h1 { font-size: 1.6rem; color: var(--text); margin-bottom: 0.8rem; }
    .thankyou p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
    .saved-tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin: 1rem 0; }

    /* Range slider */
    .range-wrap { padding: 0.5rem 0; }
    .range-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
    input[type=range] {
      width: 100%;
      accent-color: var(--primary);
      height: 6px;
      cursor: pointer;
    }
    .range-value { text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-top: 0.5rem; }

    @media (max-width: 480px) {
      .options-grid { grid-template-columns: 1fr; }
      .card { padding: 1.5rem; }
    }
  </style>
</head>

          <p>Suas preferências foram registradas. Agora é a vez da Priscila responder o dela — sem ver as suas.</p>
          <p style="margin-top:1rem;">Depois que os dois responderem, analisamos juntos e começamos o projeto!</p>
          <a href="index.html" style="display:inline-block;margin-top:1.5rem;text-decoration:none;color:#888;font-size:0.85rem;">← Voltar ao início</a>
        </div>
      </div>`;
    return;
  }

  const val = answers[q.key];
  let optionsHtml = '';

  if (q.type === 'single' || q.type === 'multi') {
    const isMulti = q.type === 'multi';
    const grid = q.options.length === 4 && q.options.every(o => !o.desc || o.desc.length < 40);
    const cls = grid ? 'options-grid' : 'options';
    optionsHtml = `
      ${isMulti ? '<div class="multi-hint">✓ Pode selecionar mais de um</div>' : ''}
      <div class="${cls}">
        ${q.options.map((o, i) => `
          <div class="option ${isSelected(q, i) ? 'selected' : ''}" onclick="select(${i})">
            <span class="emoji">${o.emoji}</span>
            <div>
              <span class="label">${o.label}</span>
              ${o.desc ? `<span class="desc">${o.desc}</span>` : ''}
            </div>
          </div>
        `).join('')}
      </div>`;
  } else if (q.type === 'text') {
    optionsHtml = `
      <textarea class="text-input" id="textInput" placeholder="${q.placeholder || ''}"
        oninput="answers['${q.key}']=this.value;updateNextBtn()">${val || ''}</textarea>`;
  }

  app.innerHTML = `
    <div class="card">
      <div class="section-tag">${q.section}</div>
      <div class="question">${q.question}</div>
      ${q.note ? `<div class="question-note">${q.note}</div>` : ''}
      ${optionsHtml}
    </div>`;
}

function isSelected(q, i) {
  const val = answers[q.key];
  if (q.type === 'multi') return Array.isArray(val) && val.includes(i);
  return val === i;
}

function select(i) {
  const q = questions[current];
  if (q.type === 'multi') {
    if (!Array.isArray(answers[q.key])) answers[q.key] = [];
    const idx = answers[q.key].indexOf(i);
    if (idx >= 0) answers[q.key].splice(idx, 1);
    else answers[q.key].push(i);
  } else {
    answers[q.key] = i;
  }
  render();
}

function updateNextBtn() {
  const q = questions[current];
  const btn = document.getElementById('btnNext');
  if (!btn) return;
  if (q.type === 'text') {
    btn.disabled = false; // texto é opcional
    return;
  }
  const val = answers[q.key];
  const hasAnswer = q.type === 'multi'
    ? Array.isArray(val) && val.length > 0
    : val !== undefined && val !== null;
  btn.disabled = !hasAnswer;
}

function next() {
  if (current < questions.length - 1) {
    current++;
    render();
    window.scrollTo(0, 0);
  }
}

function prev() {
  if (current > 0) {
    current--;
    render();
    window.scrollTo(0, 0);
  }
}

function getLabel(q, val) {
  if (!q || !q.options) return val;
  if (q.type === 'multi') {
    if (!Array.isArray(val)) return '';
    return val.map(i => q.options[i]?.label).join(', ');
  }
  return q.options[val]?.label || val;
}

function saveAnswers() {
  const result = { respondente: RESPONDENTE, timestamp: new Date().toISOString(), respostas: {} };
  questions.forEach(q => {
    if (q.key) {
      const raw = answers[q.key];
      result.respostas[q.key] = {
        valor: raw,
        label: getLabel(q, raw),
        pergunta: q.question
      };
    }
  });
  localStorage.setItem('briefing_luiz', JSON.stringify(result));
  console.log('Briefing salvo:', result);
  // TODO: enviar para Supabase quando configurado
  // sendToSupabase(result);
}

render();
</script>
</body>
